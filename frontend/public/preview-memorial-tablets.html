<!DOCTYPE html>
<html lang="zh-CN" data-zcode-design class="ink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周年祭 · 位牌墙 改版预览（仿实物形制）</title>
<style>
/* ═══ 主题令牌（与 app 同源） ═══ */
:root {
  --pg-red: #A63A2E;
  --pg-serif: 'Noto Serif SC', 'STSong', 'KaiTi', 'STKaiti', serif;
  --background: 220 10% 96%;
  --foreground: 220 5% 11%;
  --card: 0 0% 100%;
  --muted: 220 10% 92%;
  --muted-foreground: 220 8% 42%;
  --border: 220 10% 84%;
}
html.dark {
  --background: 0 0% 0%;
  --foreground: 0 0% 100%;
  --card: 240 3% 13%;
  --muted: 240 3% 15%;
  --muted-foreground: 220 8% 62%;
  --border: 240 2% 20%;
}
html.ink {
  --background: 36 36% 92%;
  --foreground: 24 30% 18%;
  --card: 36 30% 88%;
  --muted: 36 20% 86%;
  --muted-foreground: 24 18% 36%;
  --border: 36 18% 76%;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px; line-height: 1.6;
  transition: background-color .25s ease, color .25s ease;
}
button { font: inherit; cursor: pointer; color: inherit; background: none; border: none; }
:focus-visible { outline: 2px solid var(--pg-red); outline-offset: 2px; }

/* ═══ 顶栏（示意） ═══ */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 28px; border-bottom: 1px solid hsl(var(--border));
  background: hsl(var(--card) / .7);
}
.logo-seal {
  width: 30px; height: 30px; border-radius: 7px;
  background: var(--pg-red); color: #fff;
  font-family: var(--pg-serif); font-weight: 600; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transform: rotate(-2deg); box-shadow: 0 2px 5px rgb(0 0 0 / .18);
}
.logo-name { font-family: var(--pg-serif); letter-spacing: .18em; font-weight: 600; }
.topbar-spacer { flex: 1; }
.theme-seg { display: flex; gap: 2px; padding: 2px; border: 1px solid hsl(var(--border)); border-radius: 8px; }
.theme-seg button { padding: 3px 10px; font-size: 12px; border-radius: 6px; color: hsl(var(--muted-foreground)); }
.theme-seg button[aria-pressed="true"] { background: hsl(var(--muted)); color: hsl(var(--foreground)); }

.page { max-width: 880px; margin: 0 auto; padding: 30px 20px 70px; }

/* ═══ 页头 ═══ */
.pg-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; letter-spacing: .32em; color: hsl(var(--muted-foreground));
}
.pg-eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 2px; background: var(--pg-red); }
.pg-title { font-family: var(--pg-serif); font-size: 26px; letter-spacing: .06em; margin-top: 6px; }
.pg-subtitle { font-size: 13px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
.pg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
.pg-seal {
  width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
  background: var(--pg-red); color: #fff;
  font-family: var(--pg-serif); font-weight: 600; font-size: 24px;
  border-radius: 10px; transform: rotate(-2deg);
  box-shadow: 0 2px 6px rgb(0 0 0 / .18); user-select: none;
}
.sec-note { font-size: 13px; color: hsl(var(--muted-foreground)); margin: 6px 0 24px; }

/* ═══ 分段标题 ═══ */
.sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.sec-head::before { content: ''; width: 6px; height: 6px; border-radius: 2px; background: var(--pg-red); flex-shrink: 0; }
.sec-title { font-family: var(--pg-serif); font-size: 15px; font-weight: 600; letter-spacing: .22em; white-space: nowrap; }
.sec-rule { flex: 1; height: 1px; background: hsl(var(--border)); }
.sec-count { font-size: 12px; color: hsl(var(--muted-foreground)); }

/* ═══ 位牌（仿实物：枣红漆帽 · 蟠龙柱 · 深色牌心 · 须弥座） ═══ */
.shrine {
  display: flex; flex-wrap: wrap; gap: 30px 18px;
  padding: 34px 24px 28px;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 14px;
}
.plaque { width: 140px; display: flex; flex-direction: column; align-items: center; position: relative; }
.plaque .glow {
  position: absolute; left: 50%; top: 40px;
  width: 170px; height: 250px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgb(255 196 110 / .22) 0%, rgb(255 196 110 / .07) 45%, transparent 70%);
  opacity: 0; transition: opacity .3s ease;
  pointer-events: none;
}
.plaque:hover .glow { opacity: 1; }

.tstack { display: flex; flex-direction: column; align-items: center; position: relative; transition: transform .25s ease, filter .25s ease; }
.plaque:hover .tstack { transform: translateY(-5px); filter: drop-shadow(0 0 22px rgb(255 196 110 / .3)); }

/* 漆帽 + 金饰卷草 */
.crest { width: 132px; height: 44px; display: block; margin-top: -36px; position: relative; z-index: 2;
         filter: drop-shadow(0 2px 3px rgb(0 0 0 / .45)); }
.crest-cap { width: 132px; height: 46px;
  background: linear-gradient(180deg, #7a2b1d 0%, #58180f 55%, #4a130c 100%);
  border-radius: 14px 14px 4px 4px;
  box-shadow: inset 0 1px 0 rgb(255 214 150 / .25), 0 3px 8px rgb(0 0 0 / .4); }

/* 牌身 */
.tbody {
  position: relative;
  width: 108px; height: 178px;
  background: linear-gradient(90deg, #5c1d12 0%, #6e2416 30%, #5a1b10 62%, #4a130c 100%);
  border-radius: 3px;
  box-shadow:
    inset 0 0 0 1px rgb(233 200 118 / .35),
    inset 0 2px 5px rgb(0 0 0 / .35),
    0 8px 20px rgb(0 0 0 / .38);
}
/* 金龙柱（左右） */
.dragon {
  position: absolute; top: -20px; bottom: -6px; width: 30px; height: calc(100% + 26px);
  z-index: 3;
  filter: drop-shadow(0 1px 2px rgb(0 0 0 / .5));
}
.dragon.dl { left: -17px; }
.dragon.dr { right: -17px; transform: scaleX(-1); }

/* 牌心（深色书写面板） */
.panel {
  position: absolute; inset: 11px 15px 13px;
  background: linear-gradient(180deg, #241007 0%, #170a05 55%, #1d0c06 100%);
  border: 1px solid rgb(233 200 118 / .55);
  border-radius: 3px;
  box-shadow: inset 0 0 10px rgb(0 0 0 / .55);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.cols {
  writing-mode: vertical-rl;
  font-family: var(--pg-serif);
  height: 100%;
  padding: 6px 0;
  text-align: center;
}
.cols .side {
  display: block;
  font-size: 10px; letter-spacing: .16em;
  color: #cf9d52;
  margin: 0 4px;
  text-shadow: 0 0 5px rgb(233 200 118 / .3);
}
.cols .main {
  display: block;
  margin: 0 3px;
  color: #ecd28a;
  text-shadow: 0 0 7px rgb(233 200 118 / .4);
}
.cols .main .nm { font-size: 21px; font-weight: 600; letter-spacing: .1em; }
.cols .main .zhi { font-size: 12px; letter-spacing: .14em; color: #d9ae62; }

/* 须弥座 */
.ped1, .ped2 { display: block; }
.ped1 {
  width: 124px; height: 11px; margin-top: 5px;
  background: linear-gradient(180deg, #6e2416, #4a130c 85%);
  border-radius: 3px;
  box-shadow: inset 0 1px 0 rgb(233 200 118 / .4), 0 2px 5px rgb(0 0 0 / .3);
}
.ped2 {
  width: 148px; height: 15px; margin-top: 2px;
  background: linear-gradient(180deg, #58180f, #3a0e08 80%);
  border-radius: 3px 3px 7px 7px;
  box-shadow: inset 0 1px 0 rgb(233 200 118 / .28), 0 6px 14px rgb(0 0 0 / .35);
}

/* 祭拜入口 */
.worship-btn {
  margin-top: 10px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; padding: 4px 12px;
  border-radius: 99px;
  border: 1px solid rgb(166 58 46 / .45);
  color: var(--pg-red);
  transition: background .2s ease;
}
.worship-btn:hover { background: rgb(166 58 46 / .1); }
.worship-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ═══ 祭拜弹窗 ═══ */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgb(0 0 0 / .5);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.overlay.show { display: flex; }
.modal {
  width: 100%; max-width: 400px; max-height: 86vh; overflow: auto;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  border-radius: 14px; padding: 22px;
  box-shadow: 0 18px 50px rgb(0 0 0 / .3);
}
.modal h3 { font-family: var(--pg-serif); font-size: 16.5px; letter-spacing: .06em; margin-bottom: 4px; }
.modal .m-sub { font-size: 12px; color: hsl(var(--muted-foreground)); margin-bottom: 16px; }
.r-acts { display: flex; gap: 10px; }
.r-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 0 10px;
  border: 1px solid hsl(var(--border)); border-radius: 12px;
  background: hsl(var(--muted) / .4);
  font-size: 12.5px; color: hsl(var(--foreground) / .85);
  transition: border-color .2s ease, background .2s ease, transform .15s ease;
}
.r-btn:hover { border-color: rgb(166 58 46 / .5); background: rgb(166 58 46 / .07); transform: translateY(-1px); }
.r-btn svg { width: 18px; height: 18px; stroke: var(--pg-red); stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.r-btn small { font-size: 10.5px; color: hsl(var(--muted-foreground)); }
.m-msg { margin-top: 16px; }
.m-msg label { display: block; font-size: 12.5px; font-weight: 500; margin-bottom: 6px; }
.m-msg textarea {
  width: 100%; font: inherit; padding: 8px 12px; min-height: 64px; resize: vertical;
  border: 1px solid hsl(var(--border)); border-radius: 9px;
  background: hsl(var(--background)); color: hsl(var(--foreground));
}
.m-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12.5px; padding: 6px 12px; border-radius: 9px;
  border: 1px solid hsl(var(--border));
}
.btn.primary { background: var(--pg-red); color: #fff; border-color: transparent; }
.btn.primary:hover { background: #8f2f25; }

.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(8px);
  z-index: 60; padding: 9px 18px; border-radius: 10px;
  background: hsl(var(--foreground)); color: hsl(var(--background));
  font-size: 13px; opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ═══ 改版要点 ═══ */
.colophon {
  display: flex; flex-wrap: wrap; align-items: center; row-gap: 8px;
  margin-top: 30px; padding-top: 16px; border-top: 1px solid hsl(var(--border));
  font-size: 12.5px; color: hsl(var(--muted-foreground));
}
.colophon b { color: hsl(var(--foreground)); font-weight: 500; }
.colo-sep { margin: 0 12px; width: 1px; height: 12px; background: hsl(var(--border)); }
.note-demo { margin-top: 8px; font-size: 11.5px; color: hsl(var(--muted-foreground) / .7); }

@media (max-width: 640px) { .shrine { gap: 24px 12px; padding: 24px 10px; } .plaque { width: 128px; } }
@media (prefers-reduced-motion: no-preference) {
  .page { animation: pg-rise .4s ease-out; }
  .pg-seal { animation: pg-stamp .35s ease-out .1s both; }
}
@keyframes pg-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pg-stamp { 0% { opacity: 0; transform: scale(1.5) rotate(6deg); } 100% { opacity: 1; transform: scale(1) rotate(-2deg); } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d489"/>
      <stop offset=".45" stop-color="#d9a44e"/>
      <stop offset=".75" stop-color="#a4712a"/>
      <stop offset="1" stop-color="#e8c46f"/>
    </linearGradient>
    <!-- 漆帽金饰卷草（对称） -->
    <symbol id="crest-orn" viewBox="0 0 132 40">
      <g fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round">
        <!-- 中央团花 -->
        <circle cx="66" cy="15" r="7.5"/>
        <circle cx="66" cy="15" r="2.8" fill="url(#gold)" stroke="none"/>
        <path d="M58.5 15a7.5 7.5 0 0 1 7.5-7.5M73.5 15a7.5 7.5 0 0 0-7.5-7.5"/>
        <path d="M66 3.5c-3 2-4.5 4.5-4.5 7M66 3.5c3 2 4.5 4.5 4.5 7"/>
        <!-- 左卷草 -->
        <path d="M55 16c-9 3-16-1-16.5-8.5C38.2 3.6 43 2.4 45 5.4c1.8 2.8-.8 6-3.6 5"/>
        <path d="M55 22c-10 5-19 2-22-6"/>
        <path d="M52 26c-8 6-15 6-20 1.5"/>
        <path d="M55 16c-2 6-1.5 10 .5 13"/>
        <!-- 右卷草（镜像） -->
        <path d="M77 16c9 3 16-1 16.5-8.5C93.8 3.6 89 2.4 87 5.4c-1.8 2.8.8 6 3.6 5"/>
        <path d="M77 22c10 5 19 2 22-6"/>
        <path d="M80 26c8 6 15 6 20 1.5"/>
        <path d="M77 16c2 6 1.5 10-.5 13"/>
        <!-- 两肩垂叶 -->
        <path d="M35 24c-2.5 4-3 7-2 10M97 24c2.5 4 3 7 2 10"/>
      </g>
    </symbol>
    <!-- 蟠龙柱（风格化：S 形龙身 + 鳞点 + 爪） -->
    <symbol id="dragon-orn" viewBox="0 0 30 200">
      <g fill="none" stroke="url(#gold)" stroke-width="2.8" stroke-linecap="round">
        <!-- 龙头卷 -->
        <path d="M15 6c6 1 9 5 8 10-1 4-5 5-7 2.5-1.6-2-.4-4.5 1.8-4.5"/>
        <path d="M15 6c-4 0-7 2-8 5"/>
        <!-- 龙身 S 蜿蜒 -->
        <path d="M17 21C24 34 7 46 14 60c7 14-8 26-1 41 7 15-8 27-1 42 6 13-5 24-2 45"/>
        <!-- 背鳍小卷 -->
        <path d="M20 30c3-1 5-3.5 5.5-6M11 47c-3-1-5-3.5-5.5-6M21 74c3-1 5-3.5 5.5-6M11 92c-3-1-5-3.5-5.5-6M21 118c3-1 5-3.5 5.5-6M11 136c-3-1-5-3.5-5.5-6"/>
        <!-- 爪 -->
        <path d="M15 60l7 5M15 100l-7 5M15 140l7 5M15 176l-7 5"/>
        <!-- 尾卷 -->
        <path d="M13 187c-3 3-3 7 0 9 2 1.5 5 .5 5-2 0-2-2-3-3.5-2"/>
      </g>
      <g fill="url(#gold)">
        <circle cx="18" cy="26" r="1.3"/><circle cx="12" cy="38" r="1.3"/><circle cx="18" cy="52" r="1.3"/>
        <circle cx="11" cy="66" r="1.3"/><circle cx="18" cy="80" r="1.3"/><circle cx="12" cy="94" r="1.3"/>
        <circle cx="18" cy="108" r="1.3"/><circle cx="11" cy="122" r="1.3"/><circle cx="18" cy="136" r="1.3"/>
        <circle cx="12" cy="150" r="1.3"/><circle cx="17" cy="164" r="1.3"/>
      </g>
    </symbol>
  </defs>

  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21c4 0 6.5-2.6 6.5-6.2 0-2.5-1.3-4.4-2.7-6-.5 1-1.2 1.8-2 2.3C13.6 8.6 13 6 11 3c-.3 3-1.8 4.6-3.2 6.4C6.6 11 5.5 12.8 5.5 14.8 5.5 18.4 8 21 12 21z"/></symbol>
  <symbol id="i-flower" viewBox="0 0 24 24"><circle cx="12" cy="9" r="2.2"/><path d="M12 6.8c0-2.5 1.6-3.8 3.4-3.8 0 2.4-1.4 3.8-3.4 3.8zM12 6.8c0-2.5-1.6-3.8-3.4-3.8 0 2.4 1.4 3.8 3.4 3.8zM9.9 10.2 7 8.6M14.1 10.2 17 8.6M12 11.2v3"/><path d="M7 20c1.4-2.6 3-4 5-4s3.6 1.4 5 4z"/></symbol>
  <symbol id="i-candle" viewBox="0 0 24 24"><path d="M12 21c4 0 6.5-2.6 6.5-6.2 0-2.5-1.3-4.4-2.7-6-.5 1-1.2 1.8-2 2.3C13.6 8.6 13 6 11 3c-.3 3-1.8 4.6-3.2 6.4C6.6 11 5.5 12.8 5.5 14.8 5.5 18.4 8 21 12 21z" transform="translate(0 -1.5) scale(.82)"/><path d="M7.5 22h9M9 18.5h6v3.5H9z"/></symbol>
  <symbol id="i-incense" viewBox="0 0 24 24"><path d="M8 21 15.5 6M12 21l6-13M16 21l3.5-7"/><path d="M9 4.5c1.5-1.5 3.5-1.5 5 0"/><circle cx="15.5" cy="6" r=".6"/><circle cx="18" cy="8" r=".6"/></symbol>
  <symbol id="i-kowtow" viewBox="0 0 24 24"><circle cx="12" cy="6" r="2.5"/><path d="M6.5 20c.8-3.5 2.7-5.5 5.5-5.5s4.7 2 5.5 5.5z"/></symbol>
</svg>

<header class="topbar">
  <div class="logo-seal" aria-hidden="true">谱</div>
  <span class="logo-name">族谱</span>
  <span class="topbar-spacer"></span>
  <div class="theme-seg" role="group" aria-label="预览主题">
    <button data-theme="" aria-pressed="false">浅色</button>
    <button data-theme="ink" aria-pressed="true">墨韵</button>
    <button data-theme="dark" aria-pressed="false">暗色</button>
  </div>
</header>

<main class="page">
  <div class="pg-head">
    <div>
      <div class="pg-eyebrow">谱 牒 · 追 远</div>
      <h1 class="pg-title">王氏·祭日</h1>
      <p class="pg-subtitle">周年祭区块改版预览 —— 位牌墙（仿实物形制）</p>
    </div>
    <div class="pg-seal" aria-hidden="true">祀</div>
  </div>
  <p class="sec-note">这些先人只登记了逝世年份（无月日），无法排入忌日历。点击牌位可献花、点烛、上香、叩首，并留下追思留言。</p>

  <div class="sec-head">
    <span class="sec-title">周 年 牌 位</span>
    <span class="sec-rule"></span>
    <span class="sec-count">13 位 · 仅登记逝世年份</span>
  </div>

  <section class="shrine" id="shrine" aria-label="周年祭位牌墙"></section>

  <div class="colophon">
    <b>仿实物要点</b><span class="colo-sep"></span>
    枣红漆帽 + 金饰卷草<span class="colo-sep"></span>
    蟠龙金柱分列左右<span class="colo-sep"></span>
    深色牌心 · 大金字竖排（名讳居中，卒年右列、顯考/顯妣左列）<span class="colo-sep"></span>
    须弥座双层底<span class="colo-sep"></span>
    悬停烛光渐亮、整牌微起
  </div>
  <p class="note-demo">数据取自王氏家族真实周年祭名单（13 位）· 三主题切换对照 · 牌身恒为漆器配色，不随主题变</p>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="modal">
    <h3 id="m-title"></h3>
    <p class="m-sub" id="m-sub"></p>
    <div class="r-acts">
      <button class="r-btn" data-r="flower"><svg><use href="#i-flower"/></svg>献花<small>今日 0</small></button>
      <button class="r-btn" data-r="candle"><svg><use href="#i-candle"/></svg>点烛<small>今日 0</small></button>
      <button class="r-btn" data-r="incense"><svg><use href="#i-incense"/></svg>上香<small>今日 0</small></button>
      <button class="r-btn" data-r="kowtow"><svg><use href="#i-kowtow"/></svg>叩首<small>今日 0</small></button>
    </div>
    <div class="m-msg">
      <label for="m-input">追思留言</label>
      <textarea id="m-input" placeholder="写下对先人的追思…"></textarea>
    </div>
    <div class="m-foot">
      <button class="btn" id="m-close">关闭</button>
      <button class="btn primary" id="m-send">呈上</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ── 主题切换 ── */
document.querySelectorAll('.theme-seg button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.documentElement.classList.remove('dark', 'ink');
    if (b.dataset.theme) document.documentElement.classList.add(b.dataset.theme);
    document.querySelectorAll('.theme-seg button').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
  });
});

/* ── 真实数据：王氏家族周年祭名单（性别按称谓推断）── */
var MEMBERS = [
  { name: '王太婆',   year: 1918, female: true  },
  { name: '王太公',   year: 1920, female: false },
  { name: '王侧室',   year: 1935, female: true  },
  { name: '王大',     year: 1940, female: false },
  { name: '王大妻',   year: 1945, female: true  },
  { name: '王二',     year: 1955, female: false },
  { name: '王三',     year: 1960, female: false },
  { name: '王长',     year: 1975, female: false },
  { name: '王长妻',   year: 1980, female: true  },
  { name: '王富',     year: 2000, female: false },
  { name: '王二安',   year: 2005, female: false },
  { name: '王大安',   year: 2010, female: false },
  { name: '王大安妻', year: 2015, female: true  }
];
var CN = ['〇','一','二','三','四','五','六','七','八','九'];
function cnYear(y) {
  var s = String(y), out = '';
  for (var i = 0; i < s.length; i++) out += CN[+s.charAt(i)];
  return out;
}

var shrine = document.getElementById('shrine');
MEMBERS.forEach(function (m) {
  var cell = document.createElement('div');
  cell.className = 'plaque';
  cell.innerHTML =
    '<div class="glow" aria-hidden="true"></div>' +
    '<div class="tstack" role="button" tabindex="0" aria-label="祭拜 ' + m.name + '">' +
      '<div class="crest-cap" aria-hidden="true"></div>' +
      '<svg class="crest" aria-hidden="true"><use href="#crest-orn"/></svg>' +
      '<div class="tbody">' +
        '<svg class="dragon dl" aria-hidden="true"><use href="#dragon-orn"/></svg>' +
        '<div class="panel"><div class="cols">' +
          '<span class="side">卒于' + cnYear(m.year) + '</span>' +
          '<span class="main"><span class="nm">' + m.name + '</span><span class="zhi">之神位</span></span>' +
          '<span class="side">' + (m.female ? '顯妣' : '顯考') + '</span>' +
        '</div></div>' +
        '<svg class="dragon dr" aria-hidden="true"><use href="#dragon-orn"/></svg>' +
      '</div>' +
      '<div class="ped1" aria-hidden="true"></div>' +
      '<div class="ped2" aria-hidden="true"></div>' +
    '</div>' +
    '<button class="worship-btn" data-name="' + m.name + '" data-year="' + m.year + '">' +
      '<svg><use href="#i-flame"/></svg>祭拜</button>';
  shrine.appendChild(cell);
});

function openRitual(name, year) {
  document.getElementById('m-title').textContent = name;
  document.getElementById('m-sub').textContent = cnYear(year) + ' 年卒 · 周年祭牌位';
  document.getElementById('overlay').classList.add('show');
}
function closeRitual() { document.getElementById('overlay').classList.remove('show'); }

shrine.addEventListener('click', function (e) {
  var t = e.target.closest('.tstack');
  if (t) {
    var name = (t.getAttribute('aria-label') || '').replace('祭拜 ', '');
    var m = MEMBERS.find(function (x) { return x.name === name; });
    if (m) openRitual(m.name, m.year);
    return;
  }
  var btn = e.target.closest('.worship-btn');
  if (btn) openRitual(btn.dataset.name, +btn.dataset.year);
});
shrine.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tstack')) {
    e.preventDefault();
    e.target.click();
  }
});
document.getElementById('m-close').addEventListener('click', closeRitual);
document.getElementById('overlay').addEventListener('click', function (e) { if (e.target === this) closeRitual(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeRitual(); });
document.getElementById('m-send').addEventListener('click', function () {
  closeRitual();
  toast('示例预览：心意已呈上牌位');
});
document.querySelectorAll('.r-btn').forEach(function (b) {
  b.addEventListener('click', function () {
    var c = b.querySelector('small');
    c.textContent = '今日 1';
    toast('示例预览：已' + b.textContent.replace('今日 0', '').trim());
  });
});

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove('show'); }, 2200);
}
</script>
</body>
