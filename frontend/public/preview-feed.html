<!DOCTYPE html>
<html lang="zh-CN" data-zcode-design class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祠堂记事 · 动态 改版预览</title>
<style>
/* ═══ 主题令牌（与 app 同源） ═══ */
:root {
  --pg-red: #A63A2E;
  --pg-serif: 'Noto Serif SC', 'STSong', 'KaiTi', 'STKaiti', serif;
  --background: 220 10% 96%;
  --foreground: 220 5% 11%;
  --card: 0 0% 100%;
  --muted: 220 10% 92%;
  --muted-foreground: 220 8% 42%;
  --border: 220 10% 84%;
}
html.dark {
  --background: 0 0% 0%;
  --foreground: 0 0% 100%;
  --card: 240 3% 13%;
  --muted: 240 3% 15%;
  --muted-foreground: 220 8% 62%;
  --border: 240 2% 20%;
}
html.ink {
  --background: 36 36% 92%;
  --foreground: 24 30% 18%;
  --card: 36 30% 88%;
  --muted: 36 20% 86%;
  --muted-foreground: 24 18% 36%;
  --border: 36 18% 76%;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px; line-height: 1.6;
  transition: background-color .25s ease, color .25s ease;
}
button { font: inherit; cursor: pointer; color: inherit; background: none; border: none; }
:focus-visible { outline: 2px solid var(--pg-red); outline-offset: 2px; }

/* ═══ 顶栏（示意） ═══ */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 28px; border-bottom: 1px solid hsl(var(--border));
  background: hsl(var(--card) / .7);
}
.logo-seal {
  width: 30px; height: 30px; border-radius: 7px;
  background: var(--pg-red); color: #fff;
  font-family: var(--pg-serif); font-weight: 600; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transform: rotate(-2deg); box-shadow: 0 2px 5px rgb(0 0 0 / .18);
}
.logo-name { font-family: var(--pg-serif); letter-spacing: .18em; font-weight: 600; }
.nav-here {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; padding: 4px 12px; border-radius: 8px;
  color: hsl(var(--foreground)); background: hsl(var(--muted) / .8);
}
.topbar-spacer { flex: 1; }
.theme-seg { display: flex; gap: 2px; padding: 2px; border: 1px solid hsl(var(--border)); border-radius: 8px; }
.theme-seg button { padding: 3px 10px; font-size: 12px; border-radius: 6px; color: hsl(var(--muted-foreground)); }
.theme-seg button[aria-pressed="true"] { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: hsl(var(--muted-foreground)); }
.me .ava {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: hsl(var(--muted)); font-size: 12px; font-weight: 600;
}

/* ═══ 页面 ═══ */
.page { max-width: 640px; margin: 0 auto; padding: 30px 20px 70px; }

.pg-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; letter-spacing: .32em; color: hsl(var(--muted-foreground));
}
.pg-eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 2px; background: var(--pg-red); }
.pg-title { font-family: var(--pg-serif); font-size: 28px; letter-spacing: .06em; margin-top: 6px; }
.pg-subtitle { font-size: 13px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
.pg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.pg-seal {
  width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
  background: var(--pg-red); color: #fff;
  font-family: var(--pg-serif); font-weight: 600; font-size: 24px;
  border-radius: 10px; transform: rotate(-2deg);
  box-shadow: 0 2px 6px rgb(0 0 0 / .18); user-select: none;
}

.sec-head { display: flex; align-items: center; gap: 10px; margin: 26px 0 14px; }
.sec-head::before { content: ''; width: 6px; height: 6px; border-radius: 2px; background: var(--pg-red); flex-shrink: 0; }
.sec-title { font-family: var(--pg-serif); font-size: 15px; font-weight: 600; letter-spacing: .22em; white-space: nowrap; }
.sec-rule { flex: 1; height: 1px; background: hsl(var(--border)); }
.sec-count { font-size: 12px; color: hsl(var(--muted-foreground)); }

/* ═══ 记一笔（发布框） ═══ */
.composer {
  background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px;
  padding: 14px 16px;
}
.composer-row { display: flex; gap: 12px; }
.composer .ava {
  width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: hsl(var(--muted)); font-family: var(--pg-serif); font-weight: 600; font-size: 16px;
}
.composer textarea {
  flex: 1; min-height: 64px; resize: vertical;
  border: 1px solid hsl(var(--border)); border-radius: 10px;
  background: hsl(var(--background)); color: hsl(var(--foreground));
  font: inherit; padding: 10px 14px; outline: none;
  transition: border-color .2s ease;
}
.composer textarea:focus { border-color: rgb(166 58 46 / .55); }
.composer-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-left: 52px; }
.composer-tool {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; padding: 5px 10px; border-radius: 8px;
  color: hsl(var(--muted-foreground));
  transition: background .15s ease, color .15s ease;
}
.composer-tool:hover { background: hsl(var(--muted) / .6); color: hsl(var(--foreground)); }
.composer-tool svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.composer-spacer { flex: 1; }
.composer-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13.5px; font-weight: 600; letter-spacing: .1em;
  padding: 8px 22px; border-radius: 9px; border: none; color: #fff;
  background: linear-gradient(180deg, #B84536 0%, #A63A2E 45%, #8F2F25 100%);
  box-shadow: 0 4px 14px rgb(166 58 46 / .4), inset 0 1px 0 rgb(255 226 178 / .35);
  transition: transform .2s ease, box-shadow .2s ease;
}
.composer-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgb(166 58 46 / .55); }
.composer-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ═══ 记事笺 ═══ */
.chronicle { position: relative; padding-left: 26px; }
.chronicle::before {
  content: '';
  position: absolute; left: 8px; top: 6px; bottom: 6px;
  width: 1px; background: linear-gradient(180deg, rgb(166 58 46 / .5), rgb(166 58 46 / .08));
}
.note { position: relative; margin-bottom: 18px; }
.note::before {
  content: '';
  position: absolute; left: -22px; top: 22px;
  width: 7px; height: 7px; border-radius: 50%;
  background: hsl(var(--card)); border: 1.5px solid var(--pg-red);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--pg-red) 12%, transparent);
}
.note-card {
  background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px;
  padding: 16px 18px;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.note:hover .note-card { transform: translateY(-2px); border-color: rgb(166 58 46 / .4); box-shadow: 0 8px 24px rgb(0 0 0 / .2); }
.note-top { display: flex; align-items: flex-start; gap: 12px; }
.note .ava {
  width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: hsl(var(--muted)); font-family: var(--pg-serif); font-weight: 600; font-size: 16px;
}
.note-author { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.note-name { font-family: var(--pg-serif); font-size: 14.5px; font-weight: 600; }
.note-role {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; padding: 1px 8px; border-radius: 99px;
  border: 1px solid hsl(var(--border)); color: hsl(var(--muted-foreground));
}
.note-time { font-size: 11.5px; color: hsl(var(--muted-foreground)); margin-top: 1px; }
.note-pin {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; letter-spacing: .1em; padding: 2px 9px; border-radius: 99px;
  background: color-mix(in srgb, var(--pg-red) 12%, transparent);
  color: var(--pg-red); border: 1px solid rgb(166 58 46 / .35);
}
.note-pin svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
.note-text {
  margin-top: 10px;
  font-family: var(--pg-serif); font-size: 14.5px; line-height: 1.95;
  color: hsl(var(--foreground) / .92);
}
.note-actions {
  display: flex; align-items: center; gap: 4px;
  margin-top: 12px; padding-top: 10px;
  border-top: 1px dashed hsl(var(--border));
}
.note-act {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; padding: 4px 12px; border-radius: 8px;
  color: hsl(var(--muted-foreground));
  transition: background .15s ease, color .15s ease, transform .15s ease;
}
.note-act:hover { background: hsl(var(--muted) / .5); color: hsl(var(--foreground)); }
.note-act svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.note-act.liked { color: var(--pg-red); }
.note-act.liked svg { fill: currentColor; }
.note-act.bump svg { animation: pg-like-pop .35s cubic-bezier(.34,1.6,.64,1); }
@keyframes pg-like-pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

/* 评论展开 */
.note-comments { margin-top: 10px; border-top: 1px solid hsl(var(--border)); padding-top: 10px; }
.note-comment { display: flex; gap: 8px; padding: 6px 0; font-size: 12.5px; }
.note-comment b { font-weight: 600; color: hsl(var(--foreground) / .85); flex-shrink: 0; }
.note-comment span { color: hsl(var(--muted-foreground)); }
.note-comment-input { display: flex; gap: 8px; margin-top: 6px; }
.note-comment-input input {
  flex: 1; font: inherit; font-size: 12.5px;
  border: 1px solid hsl(var(--border)); border-radius: 8px;
  background: hsl(var(--background)); color: hsl(var(--foreground));
  padding: 6px 10px; outline: none;
}
.note-comment-input input:focus { border-color: rgb(166 58 46 / .55); }
.note-comment-send {
  font-size: 12px; padding: 5px 14px; border-radius: 8px;
  background: var(--pg-red); color: #fff;
}

.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(8px);
  z-index: 60; padding: 9px 18px; border-radius: 10px;
  background: hsl(var(--foreground)); color: hsl(var(--background));
  font-size: 13px; opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.colophon {
  display: flex; flex-wrap: wrap; align-items: center; row-gap: 8px;
  margin-top: 30px; padding-top: 16px; border-top: 1px solid hsl(var(--border));
  font-size: 12.5px; color: hsl(var(--muted-foreground));
}
.colophon b { color: hsl(var(--foreground)); font-weight: 500; }
.colo-sep { margin: 0 12px; width: 1px; height: 12px; background: hsl(var(--border)); }
.note-demo { margin-top: 8px; font-size: 11.5px; color: hsl(var(--muted-foreground) / .7); }

@media (prefers-reduced-motion: no-preference) {
  .page { animation: pg-rise .45s ease-out; }
}
@keyframes pg-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

@media (max-width: 520px) {
  .page { padding: 22px 14px 50px; }
  .composer-foot { padding-left: 0; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 4.5-4 3.5 3 3.5-3.5L21 16"/></symbol>
  <symbol id="i-at" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4-8"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5C7 16.5 3.5 13.3 3.5 9.6 3.5 7 5.5 5 8 5c1.6 0 3 .8 4 2.1C13 5.8 14.4 5 16 5c2.5 0 4.5 2 4.5 4.6 0 3.7-3.5 6.9-8.5 10.9z"/></symbol>
  <symbol id="i-comment" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 4h6l-1 7 3 3H7l3-3-1-7z"/></symbol>
</svg>

<header class="topbar">
  <div class="logo-seal" aria-hidden="true">谱</div>
  <span class="logo-name">族谱</span>
  <span class="nav-here"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>祠堂记事</span>
  <span class="topbar-spacer"></span>
  <div class="theme-seg" role="group" aria-label="预览主题">
    <button data-theme="" aria-pressed="false">浅色</button>
    <button data-theme="ink" aria-pressed="false">墨韵</button>
    <button data-theme="dark" aria-pressed="true">暗色</button>
  </div>
  <div class="me"><span class="ava">牟</span>牟文安</div>
</header>

<main class="page">
  <div class="pg-head">
    <div>
      <div class="pg-eyebrow">谱 牒 · 动 态</div>
      <h1 class="pg-title">祠堂记事</h1>
      <p class="pg-subtitle">族中近事，大家共叙一门</p>
    </div>
    <div class="pg-seal" aria-hidden="true">记</div>
  </div>

  <!-- 记一笔 -->
  <div class="composer">
    <div class="composer-row">
      <span class="ava" aria-hidden="true">牟</span>
      <textarea id="composer-text" placeholder="记一笔族中近事…（支持 @提及族人）" aria-label="撰写动态"></textarea>
    </div>
    <div class="composer-foot">
      <button class="composer-tool" data-demo="插入图片"><svg><use href="#i-image"/></svg>图片</button>
      <button class="composer-tool" data-demo="@提及族人"><svg><use href="#i-at"/></svg>@族人</button>
      <span class="composer-spacer"></span>
      <button class="composer-btn" data-demo="记一笔"><svg><use href="#i-send"/></svg>记 一 笔</button>
    </div>
  </div>

  <!-- 置顶 -->
  <div class="sec-head">
    <span class="sec-title">置 顶 公 告</span>
    <span class="sec-rule"></span>
    <span class="sec-count">2 条</span>
  </div>

  <div class="chronicle" id="pinned"></div>

  <!-- 记事 -->
  <div class="sec-head">
    <span class="sec-title">族 中 近 事</span>
    <span class="sec-rule"></span>
    <span class="sec-count">3 条</span>
  </div>

  <div class="chronicle" id="feed"></div>

  <div class="colophon">
    <b>祠堂记事</b><span class="colo-sep"></span>
    时间脉络一线贯穿<span class="colo-sep"></span>
    置顶公告居首<span class="colo-sep"></span>
    宋体行文如记族中事<span class="colo-sep"></span>
    赞 / 评论直书其下
  </div>
  <p class="note-demo">动态与评论内容取自真实数据 · 深浅墨三主题切换对照 · 可框选元素留评论</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ── 主题切换 ── */
document.querySelectorAll('.theme-seg button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.documentElement.classList.remove('dark', 'ink');
    if (b.dataset.theme) document.documentElement.classList.add(b.dataset.theme);
    document.querySelectorAll('.theme-seg button').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
  });
});

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove('show'); }, 2200);
}
document.querySelectorAll('[data-demo]').forEach(function (b) {
  b.addEventListener('click', function () { toast('预览示意：' + b.dataset.demo); });
});

/* ── 真实数据（牟氏家族动态 + 评论） ── */
var POSTS = [
  { id: 1, pinned: true,  author: '管理员', ava: '管', role: '管理员', time: '前天 22:37',
    text: '族谱数字化工程已启动，目前完成永、正、文、海四代共 70 位族人的基础世系录入，欢迎各房继续补充生卒、迁徙与影像资料。',
    likes: 3, liked: false, comments: [['牟氏查看员', '已看到，我也补充几张老照片。']] },
  { id: 5, pinned: true,  author: '管理员', ava: '管', role: '管理员', time: '前天 22:37',
    text: '征集老照片启事：家中有祠堂、祭祖、婚嫁、全家福等老照片的宗亲，请与理事会联系扫描归档。',
    likes: 3, liked: false, comments: [['管理员', '资料整理得很用心，感谢！']] },
  { id: 4, pinned: false, author: '管理员', ava: '管', role: '管理员', time: '前天 22:37',
    text: '喜讯：牟文龙之子牟世安今年考入重点大学，族中设立奖学金予以表彰，望再接再厉。',
    likes: 3, liked: false, comments: [['牟氏账号', '这项活动很有意义，支持！']] },
  { id: 3, pinned: false, author: '管理员', ava: '管', role: '管理员', time: '前天 22:37',
    text: '今年族内书画展收到作品三十余幅，青年一辈笔墨不俗，耕读家风后继有人。',
    likes: 3, liked: false, comments: [] },
  { id: 2, pinned: false, author: '管理员', ava: '管', role: '管理员', time: '前天 22:37',
    text: '清明祭祖顺利举行，阖族四十余人赴阳坡门祠堂上香叩首，追思先人。感谢宗亲理事会诸位宗长的辛苦筹备。',
    likes: 3, liked: false, comments: [['成员一号', '先祖创业精神，后辈当铭记。']] }
];

function renderNote(p, container) {
  var el = document.createElement('article');
  el.className = 'note';
  el.innerHTML =
    '<div class="note-card">' +
      '<div class="note-top">' +
        '<span class="ava" aria-hidden="true">' + p.ava + '</span>' +
        '<div style="min-width:0;flex:1">' +
          '<div class="note-author">' +
            '<span class="note-name">' + p.author + '</span>' +
            '<span class="note-role">' + p.role + '</span>' +
            '<span class="note-time">' + p.time + '</span>' +
          '</div>' +
        '</div>' +
        (p.pinned ? '<span class="note-pin"><svg><use href="#i-pin"/></svg>置顶</span>' : '') +
      '</div>' +
      '<p class="note-text">' + p.text + '</p>' +
      '<div class="note-actions">' +
        '<button class="note-act like' + (p.liked ? ' liked' : '') + '" data-id="' + p.id + '">' +
          '<svg><use href="#i-heart"/></svg><span class="n">' + p.likes + '</span> 赞</button>' +
        '<button class="note-act cmt" data-id="' + p.id + '">' +
          '<svg><use href="#i-comment"/></svg><span class="n">' + p.comments.length + '</span> 评论</button>' +
      '</div>' +
      '<div class="note-comments" hidden>' +
        (p.comments.length
          ? p.comments.map(function (c) { return '<div class="note-comment"><b>' + c[0] + '</b><span>' + c[1] + '</span></div>'; }).join('')
          : '<div class="note-comment"><span>还没有评论，说点什么吧</span></div>') +
        '<div class="note-comment-input">' +
          '<input type="text" placeholder="写下你的评论…" aria-label="写评论">' +
          '<button class="note-comment-send" data-demo="发送评论">发送</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  container.appendChild(el);
}

POSTS.filter(function (p) { return p.pinned; })
  .forEach(function (p) { renderNote(p, document.getElementById('pinned')); });
POSTS.filter(function (p) { return !p.pinned; })
  .forEach(function (p) { renderNote(p, document.getElementById('feed')); });

/* ── 交互：赞（ heart 弹跳 + 计数） / 评论展开 / 发送演示 ── */
document.addEventListener('click', function (e) {
  var like = e.target.closest('.like');
  if (like) {
    var n = like.querySelector('.n');
    var v = Number(n.textContent);
    var liked = like.classList.toggle('liked');
    n.textContent = liked ? v + 1 : v - 1;
    like.classList.add('bump');
    setTimeout(function () { like.classList.remove('bump'); }, 380);
    return;
  }
  var cmt = e.target.closest('.cmt');
  if (cmt) {
    var panel = cmt.closest('.note-card').querySelector('.note-comments');
    panel.hidden = !panel.hidden;
    return;
  }
  var send = e.target.closest('.note-comment-send');
  if (send) {
    var input = send.parentElement.querySelector('input');
    if (input.value.trim()) {
      var list = send.closest('.note-comments').querySelector('.note-comment[hidden]');
      if (list) list.removeAttribute('hidden');
      var row = document.createElement('div');
      row.className = 'note-comment';
      row.innerHTML = '<b>牟文安</b><span>' + input.value.trim().replace(/</g, '&lt;') + '</span>';
      send.closest('.note-comments').insertBefore(row, send.parentElement);
      input.value = '';
      var badge = send.closest('.note-card').querySelector('.cmt .n');
      badge.textContent = Number(badge.textContent) + 1;
      toast('预览示意：评论已发送');
    }
    return;
  }
  if (e.target.id === 'composer-text' && e.type === 'keydown' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    toast('预览示意：记一笔');
  }
});

document.getElementById('composer-text').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) toast('预览示意：记一笔');
});
</script>
</body>
</html>
